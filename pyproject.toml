[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tropical-cyclone-wind-prediction"
version = "0.1.0"
description = "Reproducible, leakage-aware multi-horizon cyclone wind forecasting research."
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
cyclone-wind = "cyclone_wind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
